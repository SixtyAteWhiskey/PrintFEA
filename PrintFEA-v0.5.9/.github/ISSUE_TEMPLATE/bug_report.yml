name: Bug report
description: Report a reproducible PrintFEA problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PrintFEA version
      placeholder: 0.5.9
    validations:
      required: true
  - type: input
    id: freecad
    attributes:
      label: FreeCAD version
      placeholder: 1.1.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Linux distribution / desktop
      placeholder: Linux Mint 22.x / Ubuntu / Fedora ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include model type, key setup values, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / traceback
      description: Paste the relevant PrintFEA log, Report View, or Python console output. Remove private paths/data if needed.
      render: shell
  - type: checkboxes
    id: validation
    attributes:
      label: Validation model
      options:
        - label: I tested whether this reproduces on the included validation bar when applicable.
