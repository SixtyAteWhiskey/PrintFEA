name: Feature request
description: Suggest a focused PrintFEA improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / workflow gap
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should PrintFEA do instead?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Analysis/safety implications
      description: If this changes loads, materials, failure screening, geometry, or solver behavior, explain the assumptions that should remain visible.
